name: Production E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1,4'

permissions:
  contents: read

jobs:
  merchant-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://www.cercaliceo.com.ar
      E2E_REAL_ACCOUNT: 'true'
      E2E_MERCHANT_EMAIL: ${{ secrets.E2E_MERCHANT_EMAIL }}
      E2E_MERCHANT_PASSWORD: ${{ secrets.E2E_MERCHANT_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Complete merchant journey
        if: env.SUPABASE_SERVICE_ROLE_KEY != '' && env.E2E_MERCHANT_EMAIL != '' && env.E2E_MERCHANT_PASSWORD != ''
        run: npm run test:e2e:production
      - name: Production test setup pending
        if: env.SUPABASE_SERVICE_ROLE_KEY == '' || env.E2E_MERCHANT_EMAIL == '' || env.E2E_MERCHANT_PASSWORD == ''
        run: echo "Production E2E is ready; add the QA secrets listed in DEPLOY.md."
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-report
          path: playwright-report
          retention-days: 14
