name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Public flow and accessibility
        run: npm run test:e2e:public -- --project=desktop-chromium

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: https://www.cercaliceo.com.ar
      VITE_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check deployment secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Install and build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build

      - name: Deploy Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name cerca-liceo --branch main --commit-dirty=true

      - name: Verify production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -L --silent --output /dev/null --write-out "%{http_code}" "https://www.cercaliceo.com.ar/?release=${GITHUB_SHA}")
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          exit 1

      - name: Deployment setup pending
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Automatic deploy is ready; add the GitHub Actions secrets listed in DEPLOY.md."
